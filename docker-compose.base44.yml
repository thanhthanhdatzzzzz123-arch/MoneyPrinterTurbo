# Base44 sandbox environment for the Riverside Danang news portal.
#
# The site is plain HTML/CSS/JS served straight from the working tree, so every
# edit is visible on refresh — no build step and no prebuilt image.
services:
  web:
    image: nginx:alpine
    container_name: riverside-danang-web
    ports:
      - "3000:80"
    volumes:
      - ./riverside-danang:/usr/share/nginx/html:ro
      - ./docker/nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      base44.project: "Riverside Danang"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure
