server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vietnamese text + long-form copy compress well
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Long-lived assets: fonts, photos, banner artwork
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Always revalidate the page itself so edits show on refresh
    location / {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
